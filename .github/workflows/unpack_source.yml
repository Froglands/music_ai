
name: Unpack NadaAI Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source code
        run: |
          mkdir -p /tmp/nadaai
          unzip music_ai.zip -d /tmp/nadaai
          cp -a /tmp/nadaai/music_ai/. .
          rm music_ai.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add NadaAI source code"
          git push
